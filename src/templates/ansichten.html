{% set tab = 'ansichten' %}
{% extends 'layout.html' %}
{% block title %}Ansichten{% endblock %}
{% block head %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/ansichten.css') }}">
{% endblock %}
{% block content %}
    <div class="frame">
        <header class="header">
            <h1>Ansichten</h1>
            <button type="button" class="header-button" data-a="add-view">Hinzufügen</button>
        </header>

        <div class="z-page" id="zPage">
            <p class="z-lead" id="zLead"></p>
            <div id="zBanner"></div>
            <div id="zLists"></div>
            <div id="zSettings"></div>
        </div>
    </div>

    <div id="zSheetRoot"></div>
    <div id="zToastRoot"></div>

    {% include 'response_modal.html' %}

    <script id="zData" type="application/json">{{ zdata | tojson }}</script>
    <script src="{{ url_for('static', filename='scripts/ansichten.js') }}"></script>
{% endblock %}
