<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.name }}</title>
    <script>
        (function() {
            const theme = localStorage.getItem('inkypi-theme') || 
                         (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
        let lastModified = null;
        const refreshIntervalMs = 3 * 1000;

        async function refreshImage() {
            const img = document.querySelector('.image-container img');
            if (!img) return;

            try {
                const headers = {};
                if (lastModified) {
                    headers['If-Modified-Since'] = lastModified;
                }

                const response = await fetch('{{ url_for("main.get_current_image") }}', { headers });
                
                if (response.status === 304) {
                    // Image hasn't changed, no need to update
                    return;
                }

                if (!response.ok) {
                    console.error('Failed to fetch image:', response.status);
                    return;
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                
                // Update the image source
                img.src = objectUrl;
                
                // Store the Last-Modified header for next request
                lastModified = response.headers.get('Last-Modified');
            } catch (error) {
                console.error('Error refreshing image:', error);
            }
        }

        // Status der Display-Aktualisierung (Zeiten in Sekunden, vom Server gemessen)
        let displayStatus = null;
        let displayStatusReceived = 0;

        function formatDuration(seconds) {
            seconds = Math.max(0, Math.round(seconds));
            if (seconds < 60) return `${seconds} s`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} Min.`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} Std.`;
            const days = Math.floor(hours / 24);
            return days === 1 ? '1 Tag' : `${days} Tagen`;
        }

        function renderDisplayStatus() {
            const box = document.getElementById('displayStatus');
            if (!box || !displayStatus) return;
            const text = box.querySelector('.display-status-text');
            const bar = box.querySelector('.display-status-bar');
            const fill = box.querySelector('.display-status-fill');
            const passed = (Date.now() - displayStatusReceived) / 1000;
            const expected = displayStatus.expected_seconds;

            box.classList.toggle('refreshing', displayStatus.refreshing);
            box.classList.toggle('failed', !displayStatus.refreshing && !!displayStatus.error);
            if (displayStatus.refreshing) {
                const elapsed = displayStatus.elapsed_seconds + passed;
                bar.hidden = false;
                if (expected) {
                    const remaining = expected - elapsed;
                    fill.style.width = `${Math.min(100, elapsed / expected * 100)}%`;
                    text.textContent = remaining > 0
                        ? `Display wird aktualisiert … noch ca. ${formatDuration(remaining)}`
                        : 'Display wird aktualisiert … gleich fertig';
                } else {
                    fill.style.width = '100%';
                    text.textContent = `Display wird aktualisiert … seit ${formatDuration(elapsed)}`;
                }
                box.hidden = false;
            } else if (displayStatus.error) {
                bar.hidden = true;
                text.textContent = `Fehler beim Aktualisieren des Displays: ${displayStatus.error}`;
                box.hidden = false;
            } else if (displayStatus.seconds_since_update !== null) {
                bar.hidden = true;
                const since = displayStatus.seconds_since_update + passed;
                text.textContent = `Display aktuell – aktualisiert vor ${formatDuration(since)}`
                    + (expected ? ` (Bildaufbau: ${formatDuration(expected)})` : '');
                box.hidden = false;
            } else {
                box.hidden = true;
            }
        }

        async function refreshDisplayStatus() {
            try {
                const response = await fetch('{{ url_for("main.get_display_status") }}');
                if (!response.ok) return;
                const wasRefreshing = displayStatus && displayStatus.refreshing;
                displayStatus = await response.json();
                displayStatusReceived = Date.now();
                renderDisplayStatus();
                if (wasRefreshing && !displayStatus.refreshing) refreshImage();
            } catch (error) {
                console.error('Error refreshing display status:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Refresh image immediately on page load
            refreshImage();
            refreshDisplayStatus();
            
            // Set up auto-refresh based on plugin cycle interval
            setInterval(refreshImage, refreshIntervalMs);
            setInterval(refreshDisplayStatus, refreshIntervalMs);
            // Restzeit zwischen den Abfragen weiterzählen
            setInterval(renderDisplayStatus, 1000);
        });
    </script>
</head>
<link rel= "stylesheet" type= "text/css" href= "{{ url_for('static',filename='styles/main.css') }}">
<script src="{{ url_for('static', filename='scripts/image_modal.js') }}"></script>
<body>
    <script src="{{ url_for('static', filename='scripts/dark_mode.js') }}"></script>
    <!-- Subtle frame container -->
    <div class="frame">
        <!-- Page Title -->
        <header class="header">
            <h1>{{ config.name }}</h1>
            <button class="settings-button dark-mode-toggle" title="Dunkelmodus umschalten" aria-label="Dunkelmodus umschalten"></button>
            <a href="{{ url_for('playlist.playlists') }}" class="settings-button">
                <img src="{{ url_for('static', filename='icons/playlist.png') }}" title="Playlists" alt="Playlist-Symbol" class="icon-image">
            </a>
            <a href="{{ url_for('settings.settings_page') }}" class="settings-button">
                <img src="{{ url_for('static', filename='icons/settings.png') }}" title="Einstellungen" alt="Einstellungen-Symbol" class="icon-image">
            </a>
        </header>

        <!-- Display the current image -->
        <div class="image-container">
            <img src="{{ url_for('static', filename='images/current_image.png') }}" alt="Aktuelles Bild">
        </div>
        <div id="displayStatus" class="display-status" role="status" aria-live="polite" hidden>
            <span class="display-status-text"></span>
            <div class="display-status-bar" hidden><div class="display-status-fill"></div></div>
        </div>

        <!-- Separator -->
        <div class="separator"></div>
        <h2 class="plugins-title">Plugins</h2>
        <div class="button-grid">
            {% for plugin in plugins %}
            <a href="{{ url_for('plugin.plugin_page', plugin_id=plugin.id) }}" class="icon-button" title="{{ plugin.display_name }}" >
                <img src="{{ url_for('plugin.image', plugin_id=plugin.id, filename='icon.png') }}" alt="Symbol für {{ plugin.display_name }}" class="icon-image">
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
