<div class="form-group">
    <div class="form-group">
        <label for="title" class="form-label">Titel:</label>
        <input type="text" id="title" name="title" placeholder="Hier eingeben …" required class="form-input">
    </div>
    <div class="form-group">
        <label for="includeImages" class="form-label">Bilder anzeigen:</label>
        <div class="toggle-container">
            <input type="checkbox" id="includeImages" name="includeImages" class="toggle-checkbox" value="false"
                onclick="this.value = this.checked ? 'true' : 'false'">
            <label for="includeImages" class="toggle-label"></label>
        </div>
    </div>
    <div class="form-group nowrap">
        <label for="fontSize" class="form-label">Schriftgröße:</label>
        <select id="fontSize" name="fontSize" class="form-input">
            <option value="x-small">Sehr klein</option>
            <option value="small">Klein</option>
            <option value="normal">Normal</option>
            <option value="large">Groß</option>
            <option value="x-large">Sehr groß</option>
        </select>
    </div>
</div>
<div class="form-group">
    <div class="form-group">
        <label for="feedUrl" class="form-label">RSS-Feed-URL:</label>
        <input type="text" id="feedUrl" name="feedUrl" placeholder="Hier eingeben …" required class="form-input">
    </div>
</div>

<div class="form-group">
    <span style="color: var(--text-primary);">Achtung: Verwende nur vertrauenswürdige URLs, da sonst ein Sicherheitsrisiko besteht.</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        let fontSize = "normal";
        if (loadPluginSettings) {
            document.getElementById('title').value = pluginSettings.title || '';
            document.getElementById('includeImages').checked = pluginSettings.includeImages;
            document.getElementById('feedUrl').value = pluginSettings.feedUrl || '';

            fontSize = pluginSettings.fontSize;
        }

        document.getElementById('fontSize').value = fontSize;
    });
</script>
