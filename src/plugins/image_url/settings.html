<div class="form-group">
    <label for="url" class="form-label">Bild-URL:</label>
    <input type="text" id="url" name="url" placeholder="Hier eingeben …" required class="form-input">
</div>

<div class="form-group">
    <span style="color: var(--text-primary);">Achtung: Verwende nur vertrauenswürdige URLs, da sonst ein Sicherheitsrisiko besteht. Lädt das Bild zu lange, kann der Abruf außerdem fehlschlagen.</span>
</div>

<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {        
        if (loadPluginSettings) {
            document.getElementById('url').value = pluginSettings.url;
        }
    });
</script>
