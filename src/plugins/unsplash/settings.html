<div class="form-group">
    <label for="search_query" class="form-label">Suchbegriff:</label>
    <input type="text" id="search_query" name="search_query" placeholder="Hier eingeben …" class="form-input">
    <small style="width: 100%; color: var(--text-primary);">Optional: Suchbegriff für Unsplash. Ohne Eingabe wird ein zufälliges Bild geladen.</small>
</div>

<div class="form-group">
    <label for="collections" class="form-label">Sammlungen:</label>
    <input type="text" id="collections" name="collections" placeholder="z. B. 1234,5678" class="form-input">
    <small style="width: 100%; color: var(--text-primary);">Optional: Kommagetrennte Liste von Unsplash-Sammlungs-IDs.</small>
</div>

<div class="form-group">
    <div class="form-group">
        <label for="content_filter" class="form-label">Inhaltsfilter:</label>
        <select id="content_filter" name="content_filter" class="form-input">
            <option value="low">Nacktheit und Gewalt vermeiden</option>
            <option value="high">Kein Filter</option>
        </select>
    </div>

    <div class="form-group">
        <label for="color" class="form-label">Farbe:</label>
        <select id="color" name="color" class="form-input">
            <option value="">Beliebig</option>
            <option value="black_and_white">Schwarz-Weiß</option>
            <option value="black">Schwarz</option>
            <option value="white">Weiß</option>
            <option value="yellow">Gelb</option>
            <option value="orange">Orange</option>
            <option value="red">Rot</option>
            <option value="purple">Lila</option>
            <option value="magenta">Magenta</option>
            <option value="green">Grün</option>
            <option value="teal">Petrol</option>
            <option value="blue">Blau</option>
        </select>
    </div>

    <div class="form-group">
        <label for="orientation" class="form-label">Ausrichtung:</label>
        <select id="orientation" name="orientation" class="form-input">
            <option value="">Beliebig</option>
            <option value="landscape">Querformat</option>
            <option value="portrait">Hochformat</option>
        </select>
    </div>
</div>

<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {        
        if (loadPluginSettings) {
            document.getElementById('search_query').value = pluginSettings.search_query || '';
            document.getElementById('collections').value = pluginSettings.collections || '';
            document.getElementById('content_filter').value = pluginSettings.content_filter || 'low';
            document.getElementById('color').value = pluginSettings.color || '';
            document.getElementById('orientation').value = pluginSettings.orientation || '';
        }
    });
</script>
